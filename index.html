<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>AirHatch — Expense Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#4A4233;
    --terracotta:#6E452A;
    --cream:#F0EEEB;
    --cream2:#E0DDD4;
    --ink:#161510;
    --gold:#B98B52;
    --danger:#8C3B2E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--cream2);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(74,66,51,0.06), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(110,69,42,0.08), transparent 45%);
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{ width:100%; max-width:440px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.01em;
    color:var(--olive);
  }
  .brand span{ color:var(--terracotta); }
  .lang-toggle{
    border:1px solid var(--olive);
    background:transparent;
    color:var(--olive);
    font-family:'Manrope', sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .lang-toggle:active{ background:var(--olive); color:var(--cream); }

  .card{
    background:var(--cream);
    border-radius:14px;
    padding:26px 22px 22px;
    position:relative;
    box-shadow:0 18px 40px -18px rgba(22,21,16,0.35);
  }
  /* receipt perforation motif — the signature element */
  .card::before{
    content:"";
    position:absolute;
    top:-1px; left:16px; right:16px; height:1px;
    background-image:linear-gradient(to right, var(--ink) 40%, transparent 0%);
    background-size:10px 1px;
    opacity:0.15;
  }
  .card::after{
    content:"";
    position:absolute; left:-9px; top:-9px; width:18px; height:18px;
    background:var(--cream2); border-radius:50%;
  }
  .notch-r{
    content:"";
    position:absolute; right:-9px; top:-9px; width:18px; height:18px;
    background:var(--cream2); border-radius:50%;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--terracotta);
    margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 22px;
    color:var(--ink);
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--olive);
    margin-bottom:6px;
  }
  select, input[type=text], input[type=number], input[type=date]{
    width:100%;
    padding:13px 12px;
    border:1.5px solid var(--cream2);
    background:#fff;
    border-radius:8px;
    font-family:'Manrope', sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%234A4233' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  select:focus, input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(185,139,82,0.18); }

  .amount-field input{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:600;
    padding:14px 12px;
  }
  .amount-wrap{ position:relative; }
  .amount-wrap .egp{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:13px; font-weight:600; color:var(--terracotta);
    pointer-events:none;
  }

  .row2{ display:flex; gap:12px; }
  .row2 .field{ flex:1; }

  button.submit{
    width:100%;
    background:var(--olive);
    color:var(--cream);
    border:none;
    padding:16px;
    border-radius:8px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    margin-top:6px;
  }
  button.submit:active{ background:var(--ink); }
  button.submit:disabled{ opacity:0.5; }

  .hint{
    font-size:12px; color:#6b6455; margin-top:10px; text-align:center;
  }

  .banner{
    background:#fdf1e7; border:1px solid var(--gold); color:var(--terracotta);
    font-size:13px; padding:12px 14px; border-radius:8px; margin-bottom:16px; line-height:1.5;
  }

  /* success receipt state */
  .receipt{ display:none; }
  .receipt.show{ display:block; }
  .receipt .stub{
    border:1.5px dashed var(--olive);
    border-radius:8px;
    padding:18px;
    margin-top:6px;
  }
  .receipt .check{
    width:40px; height:40px; border-radius:50%; background:var(--olive);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  }
  .receipt .check svg{ width:20px; height:20px; }
  .receipt .row{
    display:flex; justify-content:space-between; padding:7px 0;
    border-bottom:1px dotted var(--cream2);
    font-family:'JetBrains Mono', monospace; font-size:13px;
  }
  .receipt .row:last-child{ border-bottom:none; }
  .receipt .row .k{ color:#8a8272; }
  .receipt .row .v{ color:var(--ink); font-weight:600; }
  .receipt-title{ text-align:center; font-family:'Fraunces', serif; font-size:19px; margin-bottom:2px;}
  .receipt-sub{ text-align:center; font-size:12px; color:#8a8272; margin-bottom:16px; }
  button.again{
    width:100%; background:transparent; border:1.5px solid var(--olive); color:var(--olive);
    padding:13px; border-radius:8px; font-weight:700; font-size:14px; margin-top:16px; cursor:pointer;
  }

  [dir="rtl"] .amount-wrap .egp{ right:auto; left:14px; }
  [dir="rtl"] select{ background-position:left 14px center; padding-right:12px; padding-left:36px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">AirHatch <span>·</span> <span id="brandSub">Expense Log</span></div>
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">AR / العربية</button>
  </div>

  <div class="card">
    <div class="notch-r"></div>

    <div id="configBanner" class="banner" style="display:none;">
      <span data-en="⚠ Setup not finished yet: open this file's code and paste your Google Apps Script URL into SCRIPT_URL near the top of the &lt;script&gt; tag. See the setup guide."
            data-ar="⚠ الإعداد لم يكتمل: افتح كود هذا الملف وضع رابط Google Apps Script في SCRIPT_URL أعلى الكود. راجع دليل الإعداد."></span>
    </div>

    <!-- FORM VIEW -->
    <div id="formView">
      <div class="eyebrow" data-en="Log a payment" data-ar="تسجيل مصروف">Log a payment</div>
      <h1 data-en="New Expense" data-ar="مصروف جديد">New Expense</h1>

      <div class="field">
        <label data-en="Apartment" data-ar="الشقة">Apartment</label>
        <select id="apartment" onchange="handleApartmentChange()">
          <option value="0/2, C19">0/2, C19</option>
          <option value="0/3, C19">0/3, C19</option>
          <option value="1/3, C19">1/3, C19</option>
          <option value="1/4, C19">1/4, C19</option>
          <option value="2/1, B10">2/1, B10</option>
          <option value="other" data-en="Other (type unit)" data-ar="أخرى (اكتب الرقم)">Other (type unit)</option>
        </select>
      </div>
      <div class="field" id="apartmentOtherWrap" style="display:none;">
        <label data-en="Unit number" data-ar="رقم الوحدة">Unit number</label>
        <input type="text" id="apartmentOther" placeholder="e.g. 3/1, C19">
      </div>

      <div class="field">
        <label data-en="Category" data-ar="البند">Category</label>
        <select id="category">
          <option value="electricity" data-en="Electricity" data-ar="كهرباء">Electricity</option>
          <option value="maintenance" data-en="Maintenance" data-ar="صيانة">Maintenance</option>
          <option value="water" data-en="Water" data-ar="مياه">Water</option>
          <option value="internet" data-en="Internet" data-ar="إنترنت">Internet</option>
          <option value="housekeeping" data-en="Housekeeping" data-ar="هاوس كيبنج">Housekeeping</option>
          <option value="supplies" data-en="Supplies" data-ar="مستلزمات">Supplies</option>
          <option value="dryclean" data-en="Dry Clean" data-ar="دراي كلين">Dry Clean</option>
          <option value="security" data-en="Security" data-ar="أمن / سيكيورتي">Security</option>
          <option value="compound_admin" data-en="Compound Admin" data-ar="إدارة الكمبوند">Compound Admin</option>
          <option value="other" data-en="Other" data-ar="أخرى">Other</option>
        </select>
      </div>

      <div class="field amount-field">
        <label data-en="Amount" data-ar="المبلغ">Amount</label>
        <div class="amount-wrap">
          <input type="number" id="amount" inputmode="decimal" placeholder="0">
          <span class="egp">EGP</span>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label data-en="Date" data-ar="التاريخ">Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label data-en="Entered by" data-ar="المُدخِل">Entered by</label>
          <select id="enteredBy">
            <option value="Youssif Tarek">Youssif Tarek</option>
            <option value="Damanhory">Damanhory</option>
            <option value="Mizo">Mizo</option>
            <option value="Other" data-en="Other" data-ar="أخرى">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label data-en="Note (optional)" data-ar="ملاحظة (اختياري)">Note (optional)</label>
        <input type="text" id="note" data-en-ph="e.g. dry clean — sofa cover" data-ar-ph="مثال: دراي كلين — غطاء أريكة" placeholder="e.g. dry clean — sofa cover">
      </div>

      <button class="submit" id="submitBtn" onclick="submitExpense()" data-en="Log Expense" data-ar="تسجيل المصروف">Log Expense</button>
      <div class="hint" data-en="Every entry syncs straight to the AirHatch finance sheet." data-ar="كل عملية تسجيل تُحفظ مباشرة في شيت AirHatch المالي.">Every entry syncs straight to the AirHatch finance sheet.</div>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="receiptView" class="receipt">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L9.5 17.5L20 6" stroke="#F0EEEB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="receipt-title" data-en="Logged" data-ar="تم التسجيل">Logged</div>
      <div class="receipt-sub" data-en="Saved to the AirHatch expense sheet" data-ar="تم الحفظ في شيت المصروفات">Saved to the AirHatch expense sheet</div>
      <div class="stub">
        <div class="row"><span class="k" data-en="Apartment" data-ar="الشقة">Apartment</span><span class="v" id="rApartment"></span></div>
        <div class="row"><span class="k" data-en="Category" data-ar="البند">Category</span><span class="v" id="rCategory"></span></div>
        <div class="row"><span class="k" data-en="Amount" data-ar="المبلغ">Amount</span><span class="v" id="rAmount"></span></div>
        <div class="row"><span class="k" data-en="Date" data-ar="التاريخ">Date</span><span class="v" id="rDate"></span></div>
        <div class="row"><span class="k" data-en="By" data-ar="بواسطة">By</span><span class="v" id="rBy"></span></div>
      </div>
      <button class="again" onclick="logAnother()" data-en="Log another" data-ar="تسجيل مصروف آخر">Log another</button>
    </div>

  </div>
</div>

<script>
  // ── SETUP: paste your Google Apps Script Web App URL below ──
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxT4ZXxZPay81zuIx9ZBw1NGrIFQ7SQJuoJJ94zcAoHKZ3ixguoMtUrKeujYzwrw-WX/exec";
  const SHARED_SECRET = "airhatch2026"; // must match the value in Code.gs

  let lang = 'en';

  function toggleLang(){
    lang = lang === 'en' ? 'ar' : 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('langToggle').textContent = lang === 'en' ? 'AR / العربية' : 'EN / English';
    document.querySelectorAll('[data-en]').forEach(el=>{
      const val = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
      if(val !== null) el.textContent = val;
    });
    const note = document.getElementById('note');
    note.placeholder = lang === 'ar' ? note.getAttribute('data-ar-ph') : note.getAttribute('data-en-ph');
  }

  function handleApartmentChange(){
    const v = document.getElementById('apartment').value;
    document.getElementById('apartmentOtherWrap').style.display = v === 'other' ? 'block' : 'none';
  }

  function today(){
    const d = new Date();
    return d.toISOString().split('T')[0];
  }
  document.getElementById('date').value = today();

  if(SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('configBanner').style.display = 'block';
  }

  function submitExpense(){
    const apartmentSel = document.getElementById('apartment').value;
    const apartment = apartmentSel === 'other' ? document.getElementById('apartmentOther').value.trim() : apartmentSel;
    const categorySel = document.getElementById('category');
    const category = categorySel.options[categorySel.selectedIndex].text;
    const amount = document.getElementById('amount').value;
    const date = document.getElementById('date').value;
    const enteredBy = document.getElementById('enteredBy').value;
    const note = document.getElementById('note').value;

    if(!apartment || !amount || !date || !enteredBy){
      alert(lang === 'ar' ? 'من فضلك أكمل كل الحقول المطلوبة' : 'Please fill in all required fields');
      return;
    }
    if(SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
      alert(lang === 'ar' ? 'الإعداد لم يكتمل بعد — راجع دليل الإعداد' : 'Setup isn\'t finished yet — see the setup guide');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    const body = new URLSearchParams({
      secret: SHARED_SECRET,
      apartment, category, amount, date, enteredBy, note
    });

    fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body })
      .then(()=> showReceipt(apartment, category, amount, date, enteredBy))
      .catch(()=> showReceipt(apartment, category, amount, date, enteredBy))
      .finally(()=> { btn.disabled = false; });
  }

  function showReceipt(apartment, category, amount, date, enteredBy){
    document.getElementById('rApartment').textContent = apartment;
    document.getElementById('rCategory').textContent = category;
    document.getElementById('rAmount').textContent = amount + ' EGP';
    document.getElementById('rDate').textContent = date;
    document.getElementById('rBy').textContent = enteredBy;
    document.getElementById('formView').style.display = 'none';
    document.getElementById('receiptView').classList.add('show');
  }

  function logAnother(){
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    document.getElementById('date').value = today();
    document.getElementById('receiptView').classList.remove('show');
    document.getElementById('formView').style.display = 'block';
  }
</script>
</body>
</html>
